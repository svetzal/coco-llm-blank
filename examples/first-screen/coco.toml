# Settings for scripts/coco.py. Paths are relative to this folder.
source = "main.asm"

# The first target is the default. Firmware is checked against roms.json.
[targets.coco1]
machine = "cocous"
cpu = "6809"
tv = "ntsc"
vdg = "6847"
ram_kib = 32
basic = "bas11.rom"
extended = "extbas10.rom"

[memory]
at = { start = 0x3000 }

# The plain build shows CG6 (PMODE 3). Each variant selects one other mode.
[variants.rg6]
defines = ["RG6"]

[variants.rg3]
defines = ["RG3"]

[variants.cg3]
defines = ["CG3"]

[variants.rg2]
defines = ["RG2"]

[variants.cg2]
defines = ["CG2"]

[variants.rg1]
defines = ["RG1"]

[variants.cg1]
defines = ["CG1"]

# For the check only: where to take the snapshot and compare the screen.
[check]
checkpoint = "ready"       # reached once the screen is set up
frames = [1]               # snapshot at the first time it is reached
unreachable = "ready+1"    # mid-instruction: must never execute
screen = 0x0400            # expected_screen() is compared from here
emulated_seconds = 10
