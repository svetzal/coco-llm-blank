# Settings for scripts/coco.py. Paths are relative to this folder.
source = "main.asm"

# The first target is the default. Firmware is checked against roms.json.
[targets.coco1]
machine = "cocous"
cpu = "6809"
tv = "ntsc"
vdg = "6847"
ram_kib = 32
basic = "bas11.rom"
extended = "extbas11.rom"

[targets.coco2]
machine = "cocous"
cpu = "6809"
tv = "ntsc"
vdg = "6847"
ram_kib = 32
basic = "bas12.rom"
extended = "extbas11.rom"

[targets.coco2b]
machine = "coco2bus"
cpu = "6809"
tv = "ntsc"
vdg = "6847t1"
ram_kib = 32
basic = "bas13.rom"
extended = "extbas11.rom"

# Each colour code on the CoCo 3 selects a palette register that BASIC loads.
# The program keeps them.
[targets.coco3]
machine = "coco3"
cpu = "6809"
tv = "ntsc"
vdg = "gime1986"
ram_kib = 128
extended = "coco3.rom"   # XRoar loads the single CoCo 3 ROM as -extbas
screen = 0x10400         # logical $0400 in the physical RAM snapshot

[memory]
at = { start = 0x3000 }

# The plain build shows CG6 (PMODE 3). Each variant selects one other mode.
# XRoar 1.13's CoCo 3 shows RG1, RG2 and RG3 with double-width pixels on
# purpose (src/tcc1014/tcc1014.c, from XRoar commit 1c35e61f). No hardware
# test confirms it. See the open question in the README. Thus those variants
# run only on the CoCo 1 and 2 targets.
[variants.rg6]
defines = ["RG6"]

[variants.rg3]
defines = ["RG3"]
targets = ["coco1", "coco2", "coco2b"]

[variants.cg3]
defines = ["CG3"]

[variants.rg2]
defines = ["RG2"]
targets = ["coco1", "coco2", "coco2b"]

[variants.cg2]
defines = ["CG2"]

[variants.rg1]
defines = ["RG1"]
targets = ["coco1", "coco2", "coco2b"]

[variants.cg1]
defines = ["CG1"]

# For the check only: where to take the snapshot and compare the screen.
[check]
checkpoint = "ready"       # reached once the screen is set up
frames = [1]               # snapshot at the first time it is reached
unreachable = "ready+1"    # mid-instruction: must never execute
screen = 0x0400            # expected_screen() is compared from here
emulated_seconds = 10
