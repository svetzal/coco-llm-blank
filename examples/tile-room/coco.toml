# Settings for scripts/coco.py. Paths are relative to this folder.
source = "main.asm"
prepare = "prepare.py"   # writes tiles.asm from tiles.png into the build folder

# NTSC CoCo architecture with an explicit non-T1 6847 VDG and firmware.
[targets.coco1]
machine = "cocous"
cpu = "6809"
tv = "ntsc"
vdg = "6847"
ram_kib = 32
basic = "bas11.rom"
extended = "extbas10.rom"

[targets.coco2]
machine = "cocous"
cpu = "6809"
tv = "ntsc"
vdg = "6847"
ram_kib = 32
basic = "bas12.rom"
extended = "extbas11.rom"

[memory]
at = { start = 0x3000 }
below = { program_end = 0x7E00 }   # the stack is reserved from $7E00

# The picture on the display is part of the claim, not only memory.
[capture]
video = true

[check]
checkpoint = "frame_ready"   # reached once per completed move
frames = ["1-42"]            # frame N shows the room after N - 1 moves
unreachable = "room"         # a data label: executing it is a fault
screen = 0x0400
emulated_seconds = 60
