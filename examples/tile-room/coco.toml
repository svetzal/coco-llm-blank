# Settings for scripts/coco.py. Paths are relative to this folder.
source = "main.asm"
prepare = "prepare.py"   # writes tiles.asm from tiles.png into the build folder

# The first target is the default. Firmware is checked against roms.json.
# The four tables are the standard targets in guidance/starter/toolchain.md.
# Measured in XRoar: RG6 with colour set 0 shows the same picture on the
# MC6847T1 of coco2b as on the MC6847.
[targets.coco1]
machine = "cocous"
cpu = "6809"
tv = "ntsc"
vdg = "6847"
ram_kib = 32
basic = "bas11.rom"
extended = "extbas11.rom"

[targets.coco2]
machine = "cocous"
cpu = "6809"
tv = "ntsc"
vdg = "6847"
ram_kib = 32
basic = "bas12.rom"
extended = "extbas11.rom"

[targets.coco2b]
machine = "coco2bus"
cpu = "6809"
tv = "ntsc"
vdg = "6847t1"
ram_kib = 32
basic = "bas13.rom"
extended = "extbas11.rom"

# The program keeps the palette registers that BASIC loads.
[targets.coco3]
machine = "coco3"
cpu = "6809"
tv = "ntsc"
vdg = "gime1986"
ram_kib = 128
extended = "coco3.rom"   # XRoar loads the single CoCo 3 ROM as -extbas
screen = 0x10400         # logical $0400 in the physical RAM snapshot

[memory]
at = { start = 0x3000 }

# The plain build redraws only the changed cells. The full variant redraws
# every cell after each move.
[variants.full]
defines = ["FULL"]

# For the check only: where to take the snapshots and compare the screen.
[check]
checkpoint = "frame_ready"   # reached once at the start and once after each move
frames = ["1-42"]            # frame N shows the room after N - 1 moves
unreachable = "state"        # a data label: executing it is a fault
screen = 0x0400              # expected_screen() is compared from here
emulated_seconds = 30
