# Settings for scripts/coco.py. Paths are relative to this folder.
source = "main.asm"
prepare = "prepare.py"   # writes tiles.asm from tiles.png into the build folder

# The first target is the default. Firmware is checked against roms.json.
[targets.coco1]
machine = "cocous"
cpu = "6809"
tv = "ntsc"
vdg = "6847"
ram_kib = 32
basic = "bas11.rom"

# NTSC CoCo 2 with its MC6847T1 VDG and CoCo 2 firmware. Measured in XRoar:
# RG6 with colour set 0 renders the same on the T1 as on the 6847.
[targets.coco2]
machine = "coco2bus"
cpu = "6809"
tv = "ntsc"
ram_kib = 32
basic = "bas12.rom"

# NTSC CoCo 3, 128 KiB, GIME 1986, in its VDG-compatible RG6 mode. The program
# keeps the palette registers that BASIC loads.
[targets.coco3]
firmware = "coco3"
machine = "coco3"
cpu = "6809"
tv = "ntsc"
vdg = "gime1986"
ram_kib = 128
extended = "coco3.rom"   # XRoar loads the single CoCo 3 ROM as -extbas
screen = 0x10400         # the snapshot is physical memory: $0400 is at $10400

[memory]
at = { start = 0x3000 }

# The plain build redraws only the changed cells. The full variant redraws
# every cell after each move.
[variants.full]
defines = ["FULL"]

# For the check only: where to take the snapshots and compare the screen.
[check]
checkpoint = "frame_ready"   # reached once at the start and once after each move
frames = ["1-42"]            # frame N shows the room after N - 1 moves
unreachable = "state"        # a data label: executing it is a fault
screen = 0x0400              # expected_screen() is compared from here
emulated_seconds = 30
