# Settings for scripts/coco.py. Paths are relative to this folder.
source = "main.asm"

# The first target is the default. Firmware is checked against roms.json.
# The two screens and the code need 32 KiB.
[targets.coco1]
machine = "cocous"
cpu = "6809"
tv = "ntsc"
vdg = "6847"
ram_kib = 32
basic = "bas11.rom"

[memory]
at = { start = 0x4000 }

# The practice is about what the display shows, so every check compares the
# rendered picture too (instrumented XRoar).
[capture]
video = true

# For the check only: where to take the snapshots.
[check]
checkpoint = "published"   # reached once for each frame, after the flip
# Both screens, the layer-order change at 32 and the inverted background at 64.
frames = [1, 2, 3, 4, 32, 33, 64, 65]
unreachable = "state"      # a data label: executing it is a fault
emulated_seconds = 20
