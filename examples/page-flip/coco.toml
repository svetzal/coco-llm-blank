# Settings for scripts/coco.py. Paths are relative to this folder.
source = "main.asm"

# The first target is the default. Firmware is checked against roms.json.
# The four tables are the standard targets in guidance/starter/toolchain.md.
# The two screens and the code need 32 KiB.
[targets.coco1]
machine = "cocous"
cpu = "6809"
tv = "ntsc"
vdg = "6847"
ram_kib = 32
basic = "bas11.rom"
extended = "extbas11.rom"

[targets.coco2]
machine = "cocous"
cpu = "6809"
tv = "ntsc"
vdg = "6847"
ram_kib = 32
basic = "bas12.rom"
extended = "extbas11.rom"

[targets.coco2b]
machine = "coco2bus"
cpu = "6809"
tv = "ntsc"
vdg = "6847t1"
ram_kib = 32
basic = "bas13.rom"
extended = "extbas11.rom"

# Under BASIC's map, CPU $0400 is physical $70400. A 128 KiB CoCo 3 has the
# same RAM at $10400, so the snapshot offset of the screens differs between
# the two sizes.
[targets.coco3]
machine = "coco3"
cpu = "6809"
tv = "ntsc"
vdg = "gime1986"
ram_kib = 128
extended = "coco3.rom"   # XRoar loads the single CoCo 3 ROM as -extbas
screen = 0x10400         # logical $0400 in the physical RAM snapshot

# The standard coco3 table at 512 KiB. The practice depends on the RAM size:
# the variant's $FF9D values address physical $70400 and $72400, which a
# 128 KiB machine reaches only through its alias.
[targets.coco3-512]
firmware = "coco3"
machine = "coco3"
cpu = "6809"
tv = "ntsc"
vdg = "gime1986"
ram_kib = 512
extended = "coco3.rom"   # XRoar loads the single CoCo 3 ROM as -extbas
screen = 0x70400         # logical $0400 in the physical RAM snapshot

# The code starts after SCREEN_B ($2400-$3BFF) and ends below $4000. On a
# CoCo 3, BASIC's reset runs its own code at $4000-$436C, so a checkpoint
# label there can be reached before the program loads.
[memory]
at = { start = 0x3C00 }
below = { ink = 0x3FFF }

# The plain build flips with the SAM and waits for the PIA field sync. This
# variant flips with the GIME's $FF9D and waits for VBORD, in native graphics.
[variants.coco3]
defines = ["COCO3"]
targets = ["coco3", "coco3-512"]

# The practice is about what the display shows, so every check compares the
# rendered picture too (instrumented XRoar).
[capture]
video = true

# For the check only: where to take the snapshots.
[check]
checkpoint = "published"   # reached once for each frame, after the flip
# Both screens, the layer-order change at 32 and the inverted background at 64.
frames = [1, 2, 3, 4, 32, 33, 64, 65]
unreachable = "state"      # a data label: executing it is a fault
emulated_seconds = 20
