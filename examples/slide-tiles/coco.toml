# Settings for scripts/coco.py. Paths are relative to this folder.
source = "main.asm"

# The first target is the default. Firmware is checked against roms.json.
# The four tables are the standard targets in guidance/starter/toolchain.md.
[targets.coco1]
machine = "cocous"
cpu = "6809"
tv = "ntsc"
vdg = "6847"
ram_kib = 32
basic = "bas11.rom"
extended = "extbas11.rom"

[targets.coco2]
machine = "cocous"
cpu = "6809"
tv = "ntsc"
vdg = "6847"
ram_kib = 32
basic = "bas12.rom"
extended = "extbas11.rom"

[targets.coco2b]
machine = "coco2bus"
cpu = "6809"
tv = "ntsc"
vdg = "6847t1"
ram_kib = 32
basic = "bas13.rom"
extended = "extbas11.rom"

# Under BASIC's map, CPU $0400 is physical $10400 in the snapshot of a
# 128 KiB CoCo 3 (as in examples/page-flip).
[targets.coco3]
machine = "coco3"
cpu = "6809"
tv = "ntsc"
vdg = "gime1986"
ram_kib = 128
extended = "coco3.rom"   # XRoar loads the single CoCo 3 ROM as -extbas

# The gime16 variant: a CoCo 3 with a 6309 and 512 KiB. The screens use
# physical pages 0-7, outside BASIC's map.
[targets.coco3-6309]
firmware = "coco3"
machine = "coco3"
cpu = "6309"
tv = "ntsc"
vdg = "gime1986"
ram_kib = 512
extended = "coco3.rom"   # XRoar loads the single CoCo 3 ROM as -extbas

# The code follows SCREEN_B and is above BASIC's reset code at $4000-$436C
# on a CoCo 3 (Tepolt PDF 56, step 8). In the gime16 build, CPU $6000-$9FFF
# is the window to a screen.
[memory]
at = { start = 0x4400 }
below = { last = 0x6000 }

# The main build is CG6 with 4 steps on the CoCo 1, 2 and 3.
[variants.steps8]
defines = ["STEPS8"]
targets = ["coco1", "coco2", "coco2b", "coco3"]

[variants.gime16]
defines = ["GIME16"]
targets = ["coco3-6309"]

# The practice is about what the display shows, so every check compares the
# rendered picture too.
[capture]
video = true

# For the check only: where to take the snapshots.
[check]
checkpoint = "published"   # reached once for each flip
# Two moves of 4 steps are 12 flips; two moves of 8 steps are 20.
frames = ["1-24"]
unreachable = "state"      # a data label: executing it is a fault
emulated_seconds = 30
