# Settings for scripts/coco.py. Paths are relative to this folder.
source = "main.asm"

# The first target is the default. Firmware is checked against roms.json.
[targets.coco1]
machine = "cocous"
cpu = "6809"
tv = "ntsc"
vdg = "6847"
ram_kib = 32
basic = "bas11.rom"
extended = "extbas10.rom"

# CoCo 2 on the same NTSC architecture, with an explicit non-T1 6847 VDG and
# CoCo 2 firmware. The coco2bus profile would select a T1 VDG instead.
[targets.coco2]
machine = "cocous"
cpu = "6809"
tv = "ntsc"
vdg = "6847"
ram_kib = 32
basic = "bas12.rom"
extended = "extbas11.rom"

[memory]
at = { start = 0x3000 }

# The plain build shows CG6 with colour set 0 (CSS=0). The variants show the
# same screen bytes with colour set 1, and in RG6 with each colour set.
[variants.css1]
defines = ["CSS1"]

[variants.rg6]
defines = ["RG6"]

[variants.rg6-css1]
defines = ["RG6", "CSS1"]

[check]
checkpoint = "ready"       # reached once the picture is drawn
frames = [1]               # snapshot at the first time it is reached
unreachable = "ready+1"    # mid-instruction: must never execute
screen = 0x0400            # expected_screen() is compared from here
emulated_seconds = 10
