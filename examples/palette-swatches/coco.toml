# Settings for scripts/coco.py. Paths are relative to this folder.
source = "main.asm"

# The first target is the default. Firmware is checked against roms.json.
# The four tables are the standard targets in guidance/starter/toolchain.md.
[targets.coco1]
machine = "cocous"
cpu = "6809"
tv = "ntsc"
vdg = "6847"
ram_kib = 32
basic = "bas11.rom"
extended = "extbas11.rom"

[targets.coco2]
machine = "cocous"
cpu = "6809"
tv = "ntsc"
vdg = "6847"
ram_kib = 32
basic = "bas12.rom"
extended = "extbas11.rom"

[targets.coco2b]
machine = "coco2bus"
cpu = "6809"
tv = "ntsc"
vdg = "6847t1"
ram_kib = 32
basic = "bas13.rom"
extended = "extbas11.rom"

# Each code selects a palette register that BASIC loads; the program keeps them.
[targets.coco3]
machine = "coco3"
cpu = "6809"
tv = "ntsc"
vdg = "gime1986"
ram_kib = 128
extended = "coco3.rom"   # XRoar loads the single CoCo 3 ROM as -extbas
screen = 0x10400         # logical $0400 in the physical RAM snapshot

[memory]
at = { start = 0x3000 }

# The plain build shows CG6 with colour set 0 (CSS=0). Each variant selects one
# other colour set and mode for the same screen bytes.
[variants.css1]
defines = ["CSS1"]

[variants.rg6]
defines = ["RG6"]

[variants.rg6-css1]
defines = ["RG6", "CSS1"]

# For the check only: where to take the snapshot and compare the screen.
[check]
checkpoint = "ready"       # reached once the picture is shown
frames = [1]               # snapshot at the first time it is reached
unreachable = "ready+1"    # mid-instruction: must never execute
screen = 0x0400            # expected_screen() is compared from here
emulated_seconds = 10
