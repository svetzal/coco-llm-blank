# Settings for scripts/coco.py. Paths are relative to this folder.
source = "main.asm"
prepare = "prepare.py"   # writes script.inc from turns.txt into the build folder

# The four standard targets in guidance/starter/toolchain.md. The program sets
# no display mode and writes no hardware register, so the VDG does not matter
# here. The first target is the default. On the CoCo 3 the snapshot is physical
# RAM: expected.py adds the offset of BASIC's map.
[targets.coco1]
machine = "cocous"
cpu = "6809"
tv = "ntsc"
vdg = "6847"
ram_kib = 32
basic = "bas11.rom"
extended = "extbas11.rom"

[targets.coco2]
machine = "cocous"
cpu = "6809"
tv = "ntsc"
vdg = "6847"
ram_kib = 32
basic = "bas12.rom"
extended = "extbas11.rom"

[targets.coco2b]
machine = "coco2bus"
cpu = "6809"
tv = "ntsc"
vdg = "6847t1"
ram_kib = 32
basic = "bas13.rom"
extended = "extbas11.rom"

[targets.coco3]
machine = "coco3"
cpu = "6809"
tv = "ntsc"
vdg = "gime1986"
ram_kib = 128
extended = "coco3.rom"   # XRoar loads the single CoCo 3 ROM as -extbas
screen = 0x10400         # logical $0400 in the physical RAM snapshot

[memory]
at = { start = 0x3000 }
below = { code_end = 0x4100 }   # the world starts at $4100

# For the check only: where to take the snapshot.
[check]
checkpoint = "finished"   # reached once, after the last record
frames = [1]
unreachable = "script"    # a data label: executing it is a fault
emulated_seconds = 10
