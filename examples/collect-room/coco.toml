# Settings for scripts/coco.py. Paths are relative to this folder.
source = "main.asm"
prepare = "assets.py"   # writes assets.inc into the build folder first

# NTSC machines with explicit 6809, 6847 VDG, keyboard layout and firmware.
[targets.coco1]
machine = "cocous"
cpu = "6809"
keyboard = "coco"
tv = "ntsc"
vdg = "6847"
ram_kib = 32
basic = "bas11.rom"

[targets.coco2]
machine = "coco2bus"
cpu = "6809"
keyboard = "coco"
tv = "ntsc"
vdg = "6847"
ram_kib = 32
basic = "bas12.rom"

[memory]
at = { start = 0x3000 }
below = { program_end = 0x7E00 }   # the stack is reserved from $7E00

# Scripted keys take effect at the scanner entry: one journey.txt line per hit.
# Each line's first word lists the held keys by these letters, or "-" for none.
[keys]
at = "sample"
letters = { U = "up", D = "down", L = "left", R = "right", F = "space", M = "m" }

# The picture on the display and the mixer output are part of the claim.
[capture]
video = true
audio = true

# The main build gets no keys and must stay on its title screen. The journey
# build plays journey.txt through the emulated keyboard (instrumented XRoar).
[variants.journey]
keys = "journey.txt"

[check]
checkpoint = "frame_ready"
frames = ["1-95"]                  # one checkpoint per journey.txt line
unreachable = "room"               # a data label: executing it is a fault
screen = 0x0400
emulated_seconds = 15
