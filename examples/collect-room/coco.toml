# Settings for scripts/coco.py. Paths are relative to this folder.
source = "main.asm"
prepare = "assets.py"   # writes assets.inc into the build folder first

# The standard targets from guidance/starter/toolchain.md, "Target tables".
# keyboard is added because the journey check sends keys.
[targets.coco1]
machine = "cocous"
cpu = "6809"
keyboard = "coco"
tv = "ntsc"
vdg = "6847"
ram_kib = 32
basic = "bas11.rom"
extended = "extbas11.rom"

[targets.coco2]
machine = "cocous"
cpu = "6809"
keyboard = "coco"
tv = "ntsc"
vdg = "6847"
ram_kib = 32
basic = "bas12.rom"
extended = "extbas11.rom"

[targets.coco2b]
machine = "coco2bus"
cpu = "6809"
keyboard = "coco"
tv = "ntsc"
vdg = "6847t1"
ram_kib = 32
basic = "bas13.rom"
extended = "extbas11.rom"

# The RAM snapshot is physical memory: the screen at logical $0400 is at
# 0x10400. expected.py adds the same offset to every address it reads.
[targets.coco3]
machine = "coco3"
cpu = "6809"
keyboard = "coco3"
tv = "ntsc"
vdg = "gime1986"
ram_kib = 128
extended = "coco3.rom"   # XRoar loads the single CoCo 3 ROM as -extbas
screen = 0x10400         # logical $0400 in the physical RAM snapshot

[memory]
at = { start = 0x3000 }

# Scripted keys take effect at the scanner entry: one journey.txt line per hit.
# Each line's first word lists the held keys by these letters, or "-" for none.
[keys]
at = "sample"
letters = { U = "up", D = "down", L = "left", R = "right", F = "space", M = "m" }

# The picture on the display and the mixer output are part of the claim.
[capture]
video = true
audio = true

# The plain build gets no keys and must stay on its title screen. The journey
# build plays journey.txt through the emulated keyboard (instrumented XRoar).
[variants.journey]
keys = "journey.txt"

# For the check only: where to take the snapshots and what to compare.
[check]
checkpoint = "frame_ready"
frames = ["1-95"]                  # one checkpoint per journey.txt line
unreachable = "room"               # a data label: executing it is a fault
screen = 0x0400
emulated_seconds = 15
