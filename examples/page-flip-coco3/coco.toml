# Settings for scripts/coco.py. Paths are relative to this folder.
source = "main.asm"

# The first target is the default. Firmware is checked against roms.json.
# NTSC CoCo 3, GIME 1986. The targets differ only in RAM size: physical
# pages 2 and 3 hold the buffers at both sizes.
[targets.coco3-128]
firmware = "coco3"
machine = "coco3"
cpu = "6809"
tv = "ntsc"
vdg = "gime1986"
ram_kib = 128
extended = "coco3.rom"   # XRoar loads the single CoCo 3 ROM as -extbas

[targets.coco3-512]
firmware = "coco3"
machine = "coco3"
cpu = "6809"
tv = "ntsc"
vdg = "gime1986"
ram_kib = 512
extended = "coco3.rom"   # XRoar loads the single CoCo 3 ROM as -extbas

[memory]
at = { start = 0x3000 }

# The practice is about what the display shows, so every check compares the
# rendered picture too (instrumented XRoar).
[capture]
video = true

# For the check only: where to take the snapshots.
[check]
checkpoint = "published"   # reached once for each scene, after the flip
frames = ["1-6"]           # scenes 0-4 in both buffers, then scene 0 again
unreachable = "state"      # a data label: executing it is a fault
emulated_seconds = 10
