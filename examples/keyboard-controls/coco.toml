# Settings for scripts/coco.py. Paths are relative to this folder.
source = "main.asm"

# The standard target tables from guidance/starter/toolchain.md. The program
# does not set a display mode, so the VDG choice does not matter here.
# Each table adds the keyboard layout of its own machine for the key script.
[targets.coco1]
machine = "cocous"
cpu = "6809"
tv = "ntsc"
vdg = "6847"
ram_kib = 32
basic = "bas11.rom"
extended = "extbas11.rom"
keyboard = "coco"

[targets.coco2]
machine = "cocous"
cpu = "6809"
tv = "ntsc"
vdg = "6847"
ram_kib = 32
basic = "bas12.rom"
extended = "extbas11.rom"
keyboard = "coco"

[targets.coco2b]
machine = "coco2bus"
cpu = "6809"
tv = "ntsc"
vdg = "6847t1"
ram_kib = 32
basic = "bas13.rom"
extended = "extbas11.rom"
keyboard = "coco"

# The CoCo 3 RAM snapshot is physical memory; expected.py adds the offset.
[targets.coco3]
machine = "coco3"
cpu = "6809"
tv = "ntsc"
vdg = "gime1986"
ram_kib = 128
extended = "coco3.rom"   # XRoar loads the single CoCo 3 ROM as -extbas
screen = 0x10400         # logical $0400 in the physical RAM snapshot
keyboard = "coco3"

[memory]
at = { start = 0x3000 }
below = { program_end = 0x4000 }   # the update records start at $4000

# Scripted keys take effect at the scanner entry: one keys.txt line per scan.
[keys]
at = "sample"
letters = { L = "left", R = "right", F = "space", M = "m" }

# The main build gets no keys: all 16 updates must stay idle at position 2.
# The keys build plays keys.txt through the emulated keyboard (instrumented XRoar).
[variants.keys]
keys = "keys.txt"

[check]
checkpoint = "finished"   # reached after the 16th update record
frames = [1]
unreachable = "state"     # a data label: executing it is a fault
emulated_seconds = 10
