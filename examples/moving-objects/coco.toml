# Settings for scripts/coco.py. Paths are relative to this folder.
source = "main.asm"

# The first target is the default. Firmware is checked against roms.json.
[targets.coco1]
machine = "cocous"
cpu = "6809"
tv = "ntsc"
vdg = "6847"
ram_kib = 32
basic = "bas11.rom"

# NTSC CoCo 2B with Color BASIC 1.2. XRoar's coco2bus profile selects an
# MC6847T1 VDG.
[targets.coco2]
machine = "coco2bus"
cpu = "6809"
tv = "ntsc"
ram_kib = 32
basic = "bas12.rom"

# NTSC CoCo 3, 128 KiB, GIME 1986, in its VDG-compatible RG6 mode. Each bit
# selects a palette register that BASIC loads; the program keeps them.
[targets.coco3]
firmware = "coco3"
machine = "coco3"
cpu = "6809"
tv = "ntsc"
vdg = "gime1986"
ram_kib = 128
extended = "coco3.rom"   # XRoar loads the single CoCo 3 ROM as -extbas
screen = 0x10400         # logical $0400 under BASIC's map (Tepolt PDF 58)

[memory]
at = { start = 0x3000 }
below = { program_end = 0x4400 }   # the scenery buffer starts at $4400

# The plain build restores from the scenery buffer. Each variant selects one
# other method.
[variants.save]
defines = ["SAVE"]

[variants.redraw]
defines = ["REDRAW"]

# For the check only: where to take the snapshots and compare the screen.
[check]
checkpoint = "frame_ready"   # reached once per completed frame
# First restore, overlap in both orders and the frame after each, layer
# swap, scenery change and the frame after it, edge reversals.
frames = [1, 2, 15, 16, 17, 31, 32, 46, 47, 64, 65, 185, 186, 369, 370]
unreachable = "state"        # a data label: executing it is a fault
screen = 0x0400              # expected_screen() is compared from here
emulated_seconds = 90
