# Settings for scripts/coco.py. Paths are relative to this folder.
source = "main.asm"

# The first target is the default. Firmware is checked against roms.json.
# The four standard targets (guidance/starter/toolchain.md, "Target tables").
# The DAC and the audio mux use the same bits on all four (README sources;
# on coco2b the check is the evidence). The program uses only 32 KiB.
[targets.coco1]
machine = "cocous"
cpu = "6809"
tv = "ntsc"
vdg = "6847"
ram_kib = 32
basic = "bas11.rom"
extended = "extbas11.rom"

[targets.coco2]
machine = "cocous"
cpu = "6809"
tv = "ntsc"
vdg = "6847"
ram_kib = 32
basic = "bas12.rom"
extended = "extbas11.rom"

[targets.coco2b]
machine = "coco2bus"
cpu = "6809"
tv = "ntsc"
vdg = "6847t1"
ram_kib = 32
basic = "bas13.rom"
extended = "extbas11.rom"

[targets.coco3]
machine = "coco3"
cpu = "6809"
tv = "ntsc"
vdg = "gime1986"
ram_kib = 128
extended = "coco3.rom"   # XRoar loads the single CoCo 3 ROM as -extbas
screen = 0x10400         # logical $0400 in the physical RAM snapshot

[memory]
at = { start = 0x3000 }

# The plain build plays a sawtooth wave. This variant plays a square wave.
[variants.square]
defines = ["SQUARE"]

# Every check also records XRoar's mixer output; expected.py's verify_sound judges it.
[capture]
audio = true

# For the check only: where to take the snapshots and what to compare.
[check]
checkpoint = "frame_ready"   # reached after each block of 256 samples
frames = [1, 16, 17, 32, 33, 63, 64]
unreachable = "state"        # a data label: executing it is a fault
screen = 0x0400
trace_from = "sample"        # trace every instruction from the first DAC write
emulated_seconds = 10
