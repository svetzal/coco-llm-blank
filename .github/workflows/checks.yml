name: Starter checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Prepare locked Python environment
        run: uv sync --locked
      - name: Check Python style
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Install assembly and emulator tools
        run: uv run python scripts/native.py
      - name: Prepare local firmware for the emulator check
        run: uv run python scripts/setup.py --target coco1 --roms-only
      - name: Test setup and real document conversion
        run: uv run pytest --cov
      - name: Initialize a project without downloaded books or ROMs
        run: |
          uv run python scripts/setup.py --target coco1 --guidance-only
          test -f local/PROJECT.md
          git check-ignore local/PROJECT.md
          test -z "$(git status --porcelain --untracked-files=all)"
