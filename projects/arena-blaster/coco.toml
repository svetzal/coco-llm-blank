# Settings for scripts/coco.py. Paths are relative to this folder.
# Keep these values the same as the contract in README.md.
source = "main.asm"
prepare = "assets.py"   # writes assets.inc into the build folder first

[targets.coco1]
machine = "cocous"
cpu = "6809"
keyboard = "coco"
tv = "ntsc"
vdg = "6847"
ram_kib = 32
basic = "bas11.rom"
extended = "extbas11.rom"   # Disk BASIC needs Extended BASIC
disk = "disk11.rom"

# Code starts after screen B ($2400-$3BFF). State and erase lists are in
# $1C00-$1FFF, between the screens. The stack is $2000-$23FF.
[memory]
at = { start = 0x3C00, state = 0x1C00 }
below = { state_end = 0x1D00, program_end = 0x7000 }

# The disk command puts ARENA.BIN on a Disk BASIC disk image.
[disk]
name = "ARENA"

# Scripted keys take effect at the scanner entry: one script line per frame.
# Each line's first word lists the held keys by these letters. C is not a
# game key: it is the wrong-key control.
[keys]
at = "scan"
letters = { W = "w", S = "s", A = "a", D = "d", O = "o", L = "l", K = "k", ";" = "semicolon", C = "c" }

[capture]
video = true
audio = true

# The main build has no controls and gets no keys: it shows the title
# screen. The variants below use test-harness controls (README.md
# "Checks"), each for one game element. SKIP_TITLE starts a game at once.
[variants.moves]
defines = ["SKIP_TITLE", "NO_READY", "NO_ENEMIES"]
keys = "moves.txt"

[variants.hit]
defines = ["SKIP_TITLE", "NO_READY", "FIXED_ENEMIES", "STILL", "FIRST_SCORE=0x0990"]
keys = "hit.txt"

[variants.touch]
defines = ["SKIP_TITLE", "FIXED_ENEMIES"]

[variants.hunter]
defines = ["SKIP_TITLE", "NO_READY", "NO_ENEMIES", "HUNTER_SOON", "NO_DEATH"]

[variants.level1]
defines = ["SKIP_TITLE"]

[variants.level3]
defines = ["SKIP_TITLE", "FIRST_LEVEL=3", "NO_DEATH"]

[variants.level5]
defines = ["SKIP_TITLE", "FIRST_LEVEL=5", "NO_DEATH"]

[variants.shooter]
defines = ["SKIP_TITLE", "NO_READY", "ONE_SHOOTER"]
keys = "shooter.txt"

[variants.pickups]
defines = ["SKIP_TITLE", "NO_READY", "FIXED_ENEMIES", "STILL", "FIRST_LEVEL=4", "DROP_EVERY=1"]
keys = "pickups.txt"

[variants.bomb]
defines = ["SKIP_TITLE", "NO_READY", "FIXED_ENEMIES", "STILL", "FIXED_PICKUP=5"]
keys = "bomb.txt"

[variants.double]
defines = ["SKIP_TITLE", "NO_READY", "NO_ENEMIES", "FIRST_POWER=2", "POWER_TIME=100"]
keys = "powers.txt"

[variants.spread]
defines = ["SKIP_TITLE", "NO_READY", "NO_ENEMIES", "FIRST_POWER=3", "POWER_TIME=100"]
keys = "powers.txt"

[variants.star]
defines = ["SKIP_TITLE", "NO_READY", "NO_ENEMIES", "FIRST_POWER=4", "POWER_TIME=100"]
keys = "powers.txt"

[variants.level10]
defines = ["SKIP_TITLE", "FIRST_LEVEL=10"]

[variants.over]
defines = ["SKIP_TITLE", "NO_READY", "FIRST_LIVES=1"]

[variants.scores]
defines = ["NO_READY", "FIXED_ENEMIES", "FIRST_LIVES=1", "FIRST_SCORE=0x5000"]
keys = "scores.txt"

[check]
checkpoint = "published"   # reached once for each frame, after the flip
frames = ["1-200"]       # covers the longest script, moves.txt
unreachable = "state"      # a data label: executing it is a fault
screen = 0x0400
emulated_seconds = 20
