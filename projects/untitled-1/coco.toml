# Settings for scripts/coco.py. Paths are relative to this folder.
source = "main.asm"
prepare = "prepare.py"   # converts art/creatures/*.png into sprite includes

# The first target is the default. Firmware is checked against roms.json.
# Record these values in the contract of the project README. The tables of the
# standard targets are in guidance/starter/toolchain.md, under "Target tables".
[targets.coco3]
machine = "coco3"
cpu = "6309"
tv = "ntsc"
vdg = "gime1986"
ram_kib = 512
extended = "coco3.rom"   # XRoar loads the single CoCo 3 ROM as -extbas
disk = "disk11.rom"
keyboard = "coco3"        # the key script uses the CoCo 3 keyboard layout

[memory]
at = { start = 0x0E00 }
below = { ends = 0x6000 }   # CPU $6000-$7FFF is the screen window

# The rendered picture is the evidence for the display.
[capture]
video = true

# Scripted keys take effect at the scanner entry: one script line per scan.
[keys]
at = "sample"
letters = { U = "up", D = "down", L = "left", R = "right", F = "space" }

# The main build gets no keys: it must stay at the title screen.
# The play build is the same program, with play.txt through the keyboard.
[variants.play]
keys = "play.txt"

# For the check only: fixed layouts, and a new microbe in the first empty
# square, so the key scripts can give each board by hand.
[variants.rules]
keys = "keys.txt"
defines = ["LAYOUT", "RULES", "FIRST_EMPTY"]

[variants.win]
keys = "win.txt"
defines = ["LAYOUT", "WIN", "FIRST_EMPTY"]

[variants.lose]
keys = "lose.txt"
defines = ["LAYOUT", "LOSE", "FIRST_EMPTY"]

# For the check: the label where each snapshot is taken (once for each scan,
# so once for each key-script line), and a data label that must never run.
[check]
checkpoint = "ready"
frames = ["1-21"]
unreachable = "lines"
emulated_seconds = 60
